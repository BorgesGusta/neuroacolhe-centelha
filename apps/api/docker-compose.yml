services:
  app:
    container_name: neuroacolhe-api
    build: .
    env_file:
      - .env
    dns:
      - 8.8.8.8
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - neuroacolhe_network
  db:
    image: postgres:16-alpine
    container_name: neuroacolhe-db
    env_file:
      - .env
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - neuroacolhe_network
networks:
  neuroacolhe_network:
    driver: bridge
volumes:
  postgres-data:
